# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskforge
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# S3 Configuration (LocalStack/S3 compatible)
app.s3.endpoint=http://localhost:4566
app.s3.access-key=test
app.s3.secret-key=test
app.s3.bucket=taskforge-attachments
app.s3.region=us-east-1

# Logging
logging.level.com.taskforge=DEBUG
